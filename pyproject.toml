[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hundredchart"
version = "0.1.0"
description = "百数表：可打印表格、位置查询与练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "hundred-chart", "counting", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
hundredchart = "hundredchart.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/hundredchart"
Source = "https://github.com/eastyou/hundredchart"

[tool.setuptools]
packages = ["hundredchart"]
